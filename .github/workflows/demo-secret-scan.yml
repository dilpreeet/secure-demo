name: Demo Secret Scan
on:
  push:
    branches: [ "demo/security-scan", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for fake secrets
        run: |
          echo "Looking for demo API keys..."
          if grep -R -E "AKIA|API_KEY|ghp_" --exclude-dir=.git .; then
            echo "::error file=config.py::Fake secret detected (demo)."
            exit 1
          else
            echo "No secrets found."
          fi
